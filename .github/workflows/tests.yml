name: Folha Lab validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q nexus folha_lab tests
      - name: Run regression and HTTP E2E tests
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: pytest-results.xml
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser test dependencies
        run: python -m pip install -r requirements.txt "playwright>=1.55,<2"
      - name: Install Chromium with Linux dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run Chromium E2E human confirmation gates
        run: python -m pytest -q tests/test_browser_e2e.py --junitxml=browser-results.xml
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-results
          path: browser-results.xml
          if-no-files-found: ignore
