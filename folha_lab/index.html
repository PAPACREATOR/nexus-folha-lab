<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folha — laboratório</title><style>body{font:18px system-ui;background:#f4f4f2;color:#202020;margin:0}main{max-width:800px;margin:6vh auto;padding:25px}h1{font-weight:500}textarea{box-sizing:border-box;width:100%;height:38vh;resize:vertical;border:1px solid #ddd;border-radius:8px;background:white;padding:24px;font:inherit}button{margin-top:16px;padding:12px 24px;background:#222;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:8px}small{color:#666}</style><main><h1>Folha</h1><p>Escreve normalmente o que pretendes.</p><textarea id="text" aria-label="Pedido" placeholder="O que queres fazer?"></textarea><button id="send">Interpretar</button><p><small>Bancada isolada: não executa tarefas nem altera o Nexus. Sem seleção manual de processos.</small></p><pre id="result" aria-live="polite"></pre></main><script>document.getElementById("send").onclick=async()=>{const out=document.getElementById("result");out.textContent="A interpretar…";try{const r=await fetch("/interpret",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:document.getElementById("text").value})});if(!r.ok)throw Error("Pedido rejeitado");const x=await r.json();out.textContent=x.status==="RESOLVED"?"Intenção reconhecida: "+x.intent+"\nNenhuma ação foi executada.":x.question||"Pedido bloqueado.";}catch(e){out.textContent=e.message;}};</script></html>
