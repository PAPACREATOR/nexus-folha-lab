<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folha — laboratório</title>
<style>
:root { color-scheme: light; }
body { margin:0; background:#f6f6f4; color:#202020; font:18px system-ui,sans-serif; }
main { max-width:780px; margin:5vh auto; padding:24px; }
h1 { font-size:1.7em; font-weight:500; }
textarea { width:100%; min-height:34vh; padding:20px; box-sizing:border-box; border:1px solid #aaa; border-radius:8px; background:white; font:inherit; resize:vertical; }
button { margin:12px 8px 8px 0; padding:10px 18px; font:inherit; border-radius:6px; cursor:pointer; border:1px solid #444; }
button.primary { background:#222; color:white; }
button.secondary { background:white; color:#222; }
button[hidden], section[hidden] { display:none; }
output { display:block; white-space:pre-wrap; overflow-wrap:anywhere; background:white; padding:18px; border-radius:8px; margin-top:16px; min-height:24px; }
small { color:#555; }
</style>
</head>
<body>
<main>
<h1>Folha</h1>
<p>Escreve o que pretendes, por palavras tuas.</p>
<label for="text">Pedido</label>
<textarea id="text" placeholder="O que queres fazer?"></textarea>
<div><button class="primary" id="send" type="button">Interpretar</button></div>
<section id="decision" hidden aria-label="Confirmar interpretação">
<p id="proposal"></p>
<button class="primary" id="confirm" type="button">Confirmar interpretação</button>
<button class="secondary" id="reject" type="button">Não, reformular</button>
</section>
<output id="result" aria-live="polite"></output>
<p><small>Laboratório isolado: confirmar uma interpretação não executa ações, não modifica ficheiros e não comunica com o Nexus.</small></p>
</main>
<script>
"use strict";
const field = document.getElementById("text");
const out = document.getElementById("result");
const panel = document.getElementById("decision");
const proposal = document.getElementById("proposal");
const send = document.getElementById("send");
let pending = null;
function clearProposal() {
  pending = null;
  panel.hidden = true;
  proposal.textContent = "";
}
field.addEventListener("input", () => {
  if (pending) {
    clearProposal();
    out.textContent = "O texto mudou. Interpreta novamente antes de confirmar.";
  }
});
send.addEventListener("click", async () => {
  clearProposal();
  send.disabled = true;
  const requested = field.value;
  out.textContent = "A interpretar…";
  try {
    const response = await fetch("/interpret", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({text:requested})
    });
    if (!response.ok) throw new Error("Pedido não aceite.");
    const result = await response.json();
    if (field.value !== requested) {
      out.textContent = "O texto mudou durante a análise. Interpreta novamente.";
      return;
    }
    if (result.status === "RESOLVED" && result.confirmation_required === true &&
        result.original === requested && result.proposal_id) {
      pending = {text:requested, id:result.proposal_id, intent:result.intent};
      proposal.textContent = "Proponho: " + result.intent + ". É esta a tua intenção?";
      panel.hidden = false;
      out.textContent = "Aguardo a tua confirmação. Nada foi executado.";
    } else {
      out.textContent = result.question || "Não consegui compreender o pedido. Podes reformular?";
    }
  } catch (error) {
    out.textContent = "Não foi possível interpretar agora. " + error.message;
  } finally {
    send.disabled = false;
  }
});
document.getElementById("confirm").addEventListener("click", () => {
  if (!pending || pending.text !== field.value) {
    clearProposal();
    out.textContent = "A proposta mudou. Interpreta novamente.";
    return;
  }
  const intent = pending.intent;
  clearProposal();
  out.textContent = "Interpretação " + intent + " confirmada pelo humano. Nenhuma ação foi executada.";
});
document.getElementById("reject").addEventListener("click", () => {
  clearProposal();
  out.textContent = "Proposta rejeitada. Reformula o pedido para esclarecer a intenção.";
  field.focus();
});
</script>
</body>
</html>
